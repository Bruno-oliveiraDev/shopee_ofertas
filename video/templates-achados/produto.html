<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- ACHADOS · PRODUTO (1 por achado). Marcadores:
     {{N}} {{DE}} posição ("1 de 3") · {{NOME}} nome curto, até 34 (nomeCurto(nome, 34)) · {{PRECO}} "R$ 19,29" (preço real do dia)
     {{FOTO}} URL · {{FOTO_MODO}} polaroid | recorte | vendedor · {{FOTO_CORTE}} "x0,y0,x1,y1" em px da foto original, ou vazio
     {{MIRA}} "0.70,0.32" ponto do produto (só recorte), ou vazio · {{TEXTO}} uso real, até 140, com *marca* · {{NOTA}} à mão, até 30
     {{LADO}} esq|dir (alterna: produto 2 = dir) · {{POSTIT_1..3}} + {{ATUAL}} (= N) · {{PAGINA}} "3/6" -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mynerve&family=Delicious+Handrawn&family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="{{BASE}}achados.css">
</head>
<body data-tipo="produto" data-formato="{{FORMATO}}" data-semente="{{SEMENTE}}" data-atual="{{ATUAL}}" data-lado="{{LADO}}">
<div id="papel"></div><div id="vinheta"></div>
<div class="pg">{{PAGINA}}</div>
<div class="area" id="area" style="gap:30px">
  <div style="display:flex;gap:28px;align-items:flex-start">
    <div style="flex:1;min-width:0" data-k="titulo">
      <div style="display:flex;align-items:center;gap:16px"><i class="cx" data-marcada="1" style="font-size:56px"></i><span class="caneta" style="font-size:52px">{{N}} de {{DE}}</span></div>
      <div class="mao" data-fit="92,60" style="font-size:92px;margin-top:10px">{{NOME}}</div>
    </div>
    <div class="postit" data-k="postit" data-gira="3,6" style="width:270px;font-size:46px">
      <div class="it"><i class="cx"></i><span class="tx postit-letra">{{POSTIT_1}}</span></div>
      <div class="it"><i class="cx"></i><span class="tx postit-letra">{{POSTIT_2}}</span></div>
      <div class="it"><i class="cx"></i><span class="tx postit-letra">{{POSTIT_3}}</span></div>
      <div class="selo">{{PERFIL}}</div>
    </div>
  </div>
  <div id="zona" style="flex:1;min-height:300px;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <div id="alvo" data-k="foto" data-modo="{{FOTO_MODO}}" data-corte="{{FOTO_CORTE}}" data-mira="{{MIRA}}">
      <img id="fimg" src="{{FOTO}}" alt="">
    </div>
    <div class="caneta" id="anota" data-k="nota" style="font-size:56px;max-width:300px">{{NOTA}}</div>
  </div>
  <div data-k="texto">
    <div class="corpo" data-fit="46,42">{{TEXTO}}</div>
    <div style="display:flex;align-items:baseline;gap:20px;margin-top:16px;flex-wrap:wrap">
      <span class="mao" style="font-size:60px;-webkit-text-stroke:1.2px currentColor">{{PRECO}}</span>
      <span class="miudo">na Shopee · #publi · link de afiliado</span>
    </div>
  </div>
</div>
<svg id="setas"></svg>
<script src="{{BASE}}achados.js"></script>
</body></html>
