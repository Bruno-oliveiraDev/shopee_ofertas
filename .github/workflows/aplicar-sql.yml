name: Aplicar SQL no Supabase

# Roda UM arquivo .sql no banco pela API de gestao do Supabase (sem precisar abrir o SQL Editor).
# Ex.: supabase/migrations/20261007120000_cockpit.sql

on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: 'Caminho do .sql no repositorio'
        required: true
        type: string

env:
  PROJETO: ycgojwtobrpjjopylcgp

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Rodar o SQL
        run: |
          test -f "$ARQUIVO" || { echo "Arquivo nao encontrado: $ARQUIVO"; exit 1; }
          jq -Rs '{query: .}' "$ARQUIVO" > corpo.json
          curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$PROJETO/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @corpo.json
          echo
        env:
          ARQUIVO: ${{ inputs.arquivo }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
