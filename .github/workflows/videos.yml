name: Gerar artes do dia

# Todo dia as 07h (Brasilia) gera as artes (story + feed) das melhores ofertas que foram pro grupo
# nos ultimos 2 dias e deixa no cockpit (aba Artes) pra baixar e postar. Tudo nosso: HTML + Chromium.
# (O arquivo se chama videos.yml porque o 1o formato era video; trocado pela arte em 08/10.)

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      quantidade:
        description: 'Quantas artes'
        required: false
        default: '5'

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  artes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Chromium (Playwright)
        run: npm install --no-save --no-audit --no-fund playwright@1.48.2 && npx playwright install --with-deps chromium

      - name: Gerar e publicar
        run: node video/lote.mjs "${{ inputs.quantidade || '5' }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}

      - name: Guardar as artes tambem aqui (7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artes
          path: saida-artes
          if-no-files-found: ignore
          retention-days: 7
