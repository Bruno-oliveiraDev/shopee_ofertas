name: Gerar carrossel

# 2 carrosseis por dia (5 imagens cada), prontos 1 hora antes de postar:
#   11h de Brasilia -> carrossel das 12h ("Achadinhos ate R$ X")
#   19h de Brasilia -> carrossel das 20h ("Os mais vendidos pro bebe")

on:
  # quem agenda e o pg_cron do Supabase (migrations/20261009150000_agendar_actions.sql): o schedule do GitHub parou em 06/10
  workflow_dispatch:
    inputs:
      turno:
        description: 'Turno (vazio = pela hora)'
        required: false
        type: choice
        options: ['', '12h', '20h']

concurrency:
  group: carrossel
  cancel-in-progress: false

jobs:
  carrossel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Chromium (Playwright)
        run: npm install --no-save --no-audit --no-fund playwright@1.48.2 && npx playwright install --with-deps chromium

      # story animado (video narrado da historinha): FFmpeg + voz Piper pt_BR. Se falhar, o carrossel sai igual, sem video.
      - name: FFmpeg e voz (Piper)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p "$HOME/piper" && cd "$HOME/piper"
          curl -sSL https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz | tar xz
          curl -sSLO https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx
          curl -sSLO https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json
          echo "PIPER_BIN=$HOME/piper/piper/piper" >> "$GITHUB_ENV"
          echo "PIPER_VOICE=$HOME/piper/pt_BR-faber-medium.onnx" >> "$GITHUB_ENV"

      - name: Gerar e publicar
        run: node video/carrossel.mjs "${{ inputs.turno }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Guardar tambem aqui (7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrossel
          path: saida-carrossel
          if-no-files-found: ignore
          retention-days: 7
