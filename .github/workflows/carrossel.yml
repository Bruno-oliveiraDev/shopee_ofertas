name: Gerar carrossel

# 3 carrosseis por dia, prontos 1 hora antes de postar:
#   11h de Brasilia -> 12h, historinha com 3 achados ("12h")
#   15h de Brasilia -> 16h, DICAS de mae pra mae, zero venda ("dicas", video/carrossel-dicas.mjs)
#   19h de Brasilia -> 20h, historinha com 3 achados ("20h")

on:
  # quem agenda e o pg_cron do Supabase (migrations/20261009150000_agendar_actions.sql e 20261010150000_carrossel_dicas.sql)
  workflow_dispatch:
    inputs:
      turno:
        description: 'Turno (vazio = pela hora)'
        required: false
        type: choice
        options: ['', '12h', '20h', 'dicas']

concurrency:
  group: carrossel
  cancel-in-progress: false

jobs:
  carrossel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Chromium (Playwright)
        run: npm install --no-save --no-audit --no-fund playwright@1.48.2 && npx playwright install --with-deps chromium

      - name: Gerar e publicar
        run: |
          if [ "${{ inputs.turno }}" = "dicas" ]; then node video/carrossel-dicas.mjs
          else node video/carrossel.mjs "${{ inputs.turno }}"; fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # story animado desligado (10/10: ficou com cara de IA). O codigo fica em video/story-animado.mjs.
          STORY_ANIMADO: '0'

      - name: Guardar tambem aqui (7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrossel
          path: saida-carrossel
          if-no-files-found: ignore
          retention-days: 7
