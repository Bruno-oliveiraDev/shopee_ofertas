name: Baixar o que esta no ar (so leitura)

# Copia o codigo das Edge Functions publicadas e o desenho do banco (funcoes, views, colunas, agendador)
# para um pacote baixavel do workflow. NAO publica nem altera nada no Supabase.

on:
  workflow_dispatch:

env:
  PROJETO: ycgojwtobrpjjopylcgp

jobs:
  baixar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Codigo das Edge Functions publicadas
        run: |
          mkdir -p producao && cd producao
          supabase init < /dev/null >/dev/null 2>&1 || true
          supabase functions list --project-ref "$PROJETO" | tee funcoes.txt
          for f in $(supabase functions list --project-ref "$PROJETO" -o json | jq -r '.[].slug'); do
            echo "== $f"
            supabase functions download "$f" --project-ref "$PROJETO" --use-api || echo "falhou $f"
          done
          find . -type f | head -200
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Desenho do banco (somente SELECT)
        run: |
          consulta() {
            jq -n --arg q "$1" '{query: $q, read_only: true}' > corpo.json
            curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$PROJETO/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @corpo.json
          }
          consulta "select p.proname as nome, pg_get_functiondef(p.oid) as definicao from pg_proc p where p.pronamespace = 'public'::regnamespace order by 1" > producao/banco_funcoes.json
          consulta "select c.relname as nome, pg_get_viewdef(c.oid, true) as definicao from pg_class c where c.relnamespace = 'public'::regnamespace and c.relkind = 'v' order by 1" > producao/banco_views.json
          consulta "select table_name, column_name, data_type, is_nullable, column_default from information_schema.columns where table_schema = 'public' order by table_name, ordinal_position" > producao/banco_colunas.json
          consulta "select tablename, policyname, cmd, roles::text, qual, with_check from pg_policies where schemaname = 'public' order by 1, 2" > producao/banco_policies.json
          consulta "select grantee, table_name, string_agg(privilege_type, ',') from information_schema.role_table_grants where table_schema = 'public' and grantee in ('anon','authenticated') group by 1, 2 order by 2, 1" > producao/banco_grants.json
          consulta "select jobname, schedule, command, active from cron.job order by 1" > producao/banco_agendador.json
          consulta "select chave, valor from public.ajustes" > producao/banco_ajustes.json
          ls -la producao
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: producao
          path: producao
          retention-days: 7
