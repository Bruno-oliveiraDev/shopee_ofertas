name: Disparar no Telegram

on:
  schedule:
    # 3 plantoes por dia (7h50, 12h50 e 17h50 de Brasilia; cron em UTC).
    # Cada um fica ligado ~5h e posta sozinho nos horarios de config.disparo.horarios,
    # porque o agendador do GitHub atrasa e pula execucoes curtas.
    - cron: '50 10,15,20 * * *'
  workflow_dispatch:

concurrency:
  # plantao novo espera o anterior terminar; o disparo pula horario que ja teve envio
  group: shopee-disparo
  cancel-in-progress: false

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Plantao de disparos
        run: node scripts/plantao.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
