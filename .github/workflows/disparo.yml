name: Disparar no Telegram

on:
  schedule:
    # 2 por hora (aos :05 e :35), horarios em UTC (BRT = UTC-3)
    - cron: '5,35 11,12,13,15,16,17,19,20,21,22,23,0 * * *'
  workflow_dispatch:

concurrency:
  group: shopee-disparo
  cancel-in-progress: false

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Postar as proximas ofertas da fila
        run: node scripts/disparar.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELO: ${{ secrets.GEMINI_MODELO }}
