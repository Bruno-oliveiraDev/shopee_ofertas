name: Disparar no Telegram (manual)

# O disparo agendado roda no Supabase (pg_cron -> Edge Function "disparar"), na hora exata.
# Este workflow fica como plano B: posta UMA rodada na hora que voce clicar.

on:
  workflow_dispatch:
    inputs:
      teste:
        description: 'So mostrar a oferta escolhida, sem postar'
        type: boolean
        default: true

concurrency:
  group: shopee-disparo
  cancel-in-progress: false

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Disparar uma rodada
        run: node scripts/disparar.js
        env:
          TESTE: ${{ inputs.teste && '1' || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
