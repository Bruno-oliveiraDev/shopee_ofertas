name: Manter agendamentos ativos

# O GitHub desliga workflows agendados depois de 60 dias sem atividade
# no repositorio. Esse commit vazio mensal segura os dois cron rodando.

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Commit vazio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: manter agendamentos ativos"
          git push
