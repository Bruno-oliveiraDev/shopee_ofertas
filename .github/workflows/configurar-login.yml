name: Configurar login do cockpit

# Mostra a URL e a chave PUBLICA (anon) do projeto, que o site do cockpit usa,
# e diz ao Supabase para onde o link de login do e-mail deve voltar.
# A chave anon e publica por natureza (vai no navegador); quem protege os dados e o RLS de admin.

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Endereco do cockpit (ex.: https://achadinhos-cockpit.vercel.app). Vazio = so mostrar as chaves'
        required: false
        type: string

env:
  PROJETO: ycgojwtobrpjjopylcgp

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Chaves publicas
        run: |
          echo "SUPABASE_URL=https://$PROJETO.supabase.co"
          curl -sS --fail-with-body "https://api.supabase.com/v1/projects/$PROJETO/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r '.[] | select(.name == "anon" or .type == "publishable") | "\(.name) = \(.api_key)"'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Endereco de volta do login
        if: ${{ inputs.site != '' }}
        run: |
          jq -n --arg s "$SITE" '{site_url: $s, uri_allow_list: ($s + "/**,http://localhost:5173/**")}' > corpo.json
          curl -sS --fail-with-body -X PATCH "https://api.supabase.com/v1/projects/$PROJETO/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @corpo.json | jq '{site_url, uri_allow_list}'
        env:
          SITE: ${{ inputs.site }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
