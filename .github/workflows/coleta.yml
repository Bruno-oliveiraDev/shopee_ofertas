name: Coletar ofertas

on:
  schedule:
    # horarios em UTC. BRT e UTC-3, entao isso roda 7h, 13h e 19h
    - cron: '0 10,16,22 * * *'
  workflow_dispatch:

concurrency:
  group: shopee-coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Coletar e abastecer a fila
        run: node scripts/coletar.js
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELO: ${{ secrets.GEMINI_MODELO }}
