name: Coletar ofertas (manual)

# A coleta agendada roda no Supabase (pg_cron -> Edge Function "coletar"), 3x ao dia.
# Este workflow fica como plano B, para rodar uma coleta completa na mao.

on:
  workflow_dispatch:

concurrency:
  group: shopee-coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Coletar e abastecer a fila
        run: node scripts/coletar.js
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
